# 发布：推送 v* 标签时构建单文件 exe 并附加到 GitHub Release
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/DotaInsight/DotaInsight.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish

      - name: Zip artifact
        run: Compress-Archive -Path publish/DotaInsight.exe -DestinationPath DotaInsight-${{ github.ref_name }}-win-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DotaInsight-${{ github.ref_name }}-win-x64.zip
